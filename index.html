<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Space 🌀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at center, #1e3a8a 0%, #000 100%); font-family: 'Quicksand', sans-serif; color: white; min-height: 100vh; margin: 0; overflow-x: hidden; }
        .font-magic { font-family: 'Fredoka One', cursive; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(147, 197, 253, 0.2); border-radius: 30px; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 10px; }
        .img-view { width: 100%; height: 250px; object-fit: cover; border-radius: 20px; animation: pop 0.4s ease; }
        @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <div id="loginScreen" class="glass p-10 w-full max-w-sm text-center my-auto mt-20">
        <h1 class="font-magic text-3xl text-blue-300 mb-2 italic text-nowrap">Akses Biru ❄️</h1>
        <input type="password" id="passInput" class="w-full p-4 rounded-2xl bg-blue-900/40 border border-blue-400 text-center text-white outline-none focus:ring-2 focus:ring-blue-300 transition" placeholder="Sandi: biru">
        <button onclick="checkPass()" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition shadow-lg">BUKA ✨</button>
    </div>

    <div id="mainContent" class="hidden w-full max-w-lg space-y-6 pt-6 pb-20">
        
        <div id="playerCard" class="glass p-6">
            <h2 class="font-magic text-[10px] text-blue-300 mb-3 uppercase">🎵 Playlist Arijit Singh</h2>
            
            <div class="flex gap-2 mb-4">
                <button onclick="togglePlayer('yt')" class="flex-1 bg-red-900/40 border border-red-500 text-[9px] py-1 rounded-full font-bold">MODE YOUTUBE</button>
                <button onclick="togglePlayer('sp')" class="flex-1 bg-green-900/40 border border-green-500 text-[9px] py-1 rounded-full font-bold">MODE SPOTIFY</button>
            </div>

            <div id="ytContainer" class="relative w-full rounded-2xl overflow-hidden aspect-video bg-black shadow-inner">
                <iframe id="ytPlayer" class="absolute top-0 left-0 w-full h-full" 
                    src="https://www.youtube.com/embed/093556093510521111?enablejsapi=1&rel=0" 
                    frameborder="0" allow="autoplay; encrypted-media" allowfullscreen>
                </iframe>
            </div>

            <div id="spContainer" class="hidden relative w-full rounded-2xl overflow-hidden h-[352px] bg-black">
                <iframe id="spPlayer" style="border-radius:12px" 
                    src="https://open.spotify.com/embed/playlist/37i9dQZF1DZ06evO0I2w6D?utm_source=generator&theme=0" 
                    width="100%" height="352" frameBorder="0" allowfullscreen="" 
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
                </iframe>
            </div>
            
            <p class="text-[8px] text-center text-blue-400 mt-2 italic">*Spotify butuh login di browser agar lagu tidak terpotong.</p>
        </div>

        <div class="glass p-6 text-center">
            <h2 class="font-magic text-sm text-blue-300 mb-3 italic">📸 Memori PAP</h2>
            <div id="papDisplay" class="hidden mb-4 border border-blue-400/20 rounded-2xl overflow-hidden bg-black/40">
                <img id="currentPap" src="" class="img-view">
            </div>
            <div class="flex gap-2">
                <input type="file" id="uploadPap" accept="image/*" class="hidden" onchange="processUpload(this)">
                <button onclick="document.getElementById('uploadPap').click()" class="flex-1 bg-blue-900/40 border border-blue-500 py-3 rounded-xl text-[10px] font-bold">TAMBAH ➕</button>
                <button onclick="showRandomPap()" class="flex-1 bg-blue-600 py-3 rounded-xl text-[10px] font-bold shadow-lg">ACAK ✨</button>
            </div>
        </div>

        <div class="glass p-8 border-t-4 border-blue-500">
            <h2 class="font-magic text-xl text-blue-300 mb-4 text-center italic">📝 Ruang Curhat</h2>
            <textarea id="diaryBox" class="w-full h-36 bg-blue-900/10 p-4 rounded-2xl border border-blue-800 text-blue-50 outline-none resize-none" placeholder="Cerita di sini..."></textarea>
            <button onclick="saveCurhat()" class="w-full mt-4 bg-blue-700 py-3 rounded-xl font-bold shadow-md">Simpan ✨</button>
            <div id="aiResponse" class="hidden mt-6 p-4 bg-blue-400/10 border border-blue-300/30 rounded-2xl text-center italic text-sm text-blue-50">
                <p id="solusiText"></p>
            </div>
        </div>

        <div class="glass p-6 text-left">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-magic text-lg text-blue-300 italic">📜 Jejak Cerita</h2>
                <button onclick="clearHistory()" class="text-[9px] text-red-400 underline">Hapus</button>
            </div>
            <div id="historyList" class="space-y-4 max-h-60 overflow-y-auto pr-2"></div>
        </div>

        <p class="text-center text-[9px] text-blue-500 opacity-40 pb-10 italic">Private Heart v9.3 | Dual Engine 💎</p>
    </div>

    <script>
        const PIN = "biru";
        const jawaban = ["Terima kasih sudah bercerita. 💙", "Kamu hebat sudah bertahan. ✨", "Istirahatlah sejenak. 😊", "Senyummu berharga. ❄️"];

        function checkPass() {
            if(document.getElementById('passInput').value.toLowerCase() === PIN) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                renderHistory();
            } else { alert('Sandi salah.'); }
        }

        function togglePlayer(type) {
            const yt = document.getElementById('ytContainer');
            const sp = document.getElementById('spContainer');
            if(type === 'yt') {
                yt.classList.remove('hidden');
                sp.classList.add('hidden');
            } else {
                yt.classList.add('hidden');
                sp.classList.remove('hidden');
            }
        }

        function processUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const photos = JSON.parse(localStorage.getItem('myPaps') || '[]');
                    photos.push(e.target.result);
                    localStorage.setItem('myPaps', JSON.stringify(photos));
                    alert("Foto tersimpan! ✅");
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function showRandomPap() {
            const photos = JSON.parse(localStorage.getItem('myPaps') || '[]');
            if(photos.length === 0) return alert("Upload PAP dulu!");
            document.getElementById('currentPap').src = photos[Math.floor(Math.random() * photos.length)];
            document.getElementById('papDisplay').classList.remove('hidden');
        }

        function saveCurhat() {
            const input = document.getElementById('diaryBox');
            if(!input.value.trim()) return;
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            history.unshift({ date: new Date().toLocaleString('id-ID'), text: input.value });
            localStorage.setItem('chatHistory', JSON.stringify(history));
            document.getElementById('solusiText').innerText = jawaban[Math.floor(Math.random() * jawaban.length)];
            document.getElementById('aiResponse').classList.remove('hidden');
            input.value = '';
            renderHistory();
        }

        function clearHistory() {
            if(confirm("Hapus semua?")) {
                localStorage.removeItem('chatHistory');
                renderHistory();
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            const container = document.getElementById('historyList');
            container.innerHTML = history.length ? '' : '<p class="text-[10px] text-center opacity-40">Kosong...</p>';
            history.forEach(item => {
                container.innerHTML += `<div class="p-4 bg-blue-900/20 border-l-4 border-blue-500 rounded-r-xl mb-3"><p class="text-[8px] text-blue-300 font-bold">${item.date}</p><p class="text-xs text-white mt-1">${item.text}</p></div>`;
            });
        }
    </script>
</body>
</html>
