<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunia Biru Penyejuk Hati 💙</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3a8a 0%, #1e1b4b 50%, #000000 100%); font-family: 'Quicksand', sans-serif; color: white; min-height: 100vh; margin: 0; }
        .font-magic { font-family: 'Fredoka One', cursive; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(147, 197, 253, 0.2); border-radius: 30px; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <div id="loginScreen" class="glass p-10 w-full max-w-sm text-center my-auto shadow-2xl mt-20">
        <h1 class="font-magic text-3xl text-blue-300 mb-2 text-shadow">Selamat Datang ✨</h1>
        <p class="text-xs text-blue-200 mb-8 italic">Gunakan kata sandi rahasia: biru</p>
        <input type="password" id="passInput" class="w-full p-4 rounded-2xl bg-blue-900/40 border border-blue-400 text-center text-white focus:outline-none focus:ring-2 focus:ring-blue-300 transition" placeholder="Kata Sandi...">
        <button onclick="checkPass()" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition">Buka Dunia Kita 💙</button>
    </div>

    <div id="mainContent" class="hidden w-full max-w-lg space-y-6 pt-6 pb-20">
        
        <div class="glass p-6">
            <h2 class="font-magic text-sm text-blue-300 mb-3">🎵 Putar Musik Arijit Singh</h2>
            <select id="songSelect" onchange="changeSong()" class="w-full p-3 rounded-xl bg-blue-950 border border-blue-700 text-blue-200 text-sm mb-4 outline-none">
                <option value="https://www.youtube.com/embed/093556093510521111">Tum Hi Ho (Favorit)</option>
                <option value="https://www.youtube.com/embed/V7LwfY5X5oc">Kesariya (Romantis)</option>
                <option value="https://www.youtube.com/embed/HqUeSjsYLNU">Chaleya (Jawan)</option>
            </select>
            <div class="relative w-full overflow-hidden rounded-2xl shadow-lg" style="padding-top: 56.25%;">
                <iframe id="musicPlayer" class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/093556093510521111" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div class="glass p-8 border-t-4 border-blue-400">
            <h2 class="font-magic text-xl text-blue-300 mb-4">📝 Ruang Curhat</h2>
            <textarea id="diaryBox" class="w-full h-32 bg-blue-900/10 p-4 rounded-2xl border border-blue-800 text-blue-50 focus:outline-none resize-none" placeholder="Ceritakan hari ini..."></textarea>
            <button onclick="saveCurhat()" class="w-full mt-4 bg-blue-700 hover:bg-blue-600 py-3 rounded-xl font-bold shadow-md transition">Simpan & Dengar Jawaban ✨</button>
            
            <div id="aiResponse" class="hidden mt-6 p-5 bg-blue-400/10 border border-blue-300/30 rounded-2xl text-center">
                <p class="text-[10px] uppercase font-bold text-blue-300 mb-1">Pesan Untukmu:</p>
                <p id="solusiText" class="text-sm italic text-blue-50"></p>
            </div>
        </div>

        <div class="glass p-6">
            <h2 class="font-magic text-xl text-blue-300 mb-4">📜 Riwayat Cerita</h2>
            <div id="historyList" class="space-y-4 max-h-80 overflow-y-auto pr-2">
                </div>
        </div>

        <div class="glass p-6">
            <h2 class="font-magic text-xl text-blue-300 mb-4">📸 Galeri Kenangan</h2>
            <div id="gallery" class="grid grid-cols-2 gap-4 mb-4"></div>
            <input type="file" id="upload" class="hidden" multiple onchange="handleFiles(this.files)">
            <label for="upload" class="block w-full text-center bg-blue-800/30 border-2 border-dashed border-blue-400 py-4 rounded-2xl cursor-pointer">Tambah Foto</label>
        </div>

        <p class="text-center text-[10px] text-blue-500 opacity-60 pb-10">Arulmodss Project v8.1 | Quantum Engine</p>
    </div>

    <script>
        const PIN = "biru";
        const jawaban = [
            "Terima kasih sudah berbagi, kamu hebat hari ini! 💙",
            "Jangan sedih ya, elemen es selalu menemanimu dalam ketenangan. ✨",
            "Setiap cerita punya akhir yang indah, begitu juga ceritamu. 😊",
            "Istirahatlah, kamu sudah melakukan yang terbaik. ❄️"
        ];

        function checkPass() {
            if(document.getElementById('passInput').value.toLowerCase() === PIN) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                renderHistory();
                renderPhotos();
            } else { alert('Kata sandi salah, silakan coba lagi.'); }
        }

        function changeSong() {
            document.getElementById('musicPlayer').src = document.getElementById('songSelect').value;
        }

        function saveCurhat() {
            const input = document.getElementById('diaryBox');
            if(!input.value) return;

            const time = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            
            history.unshift({ date: time, text: input.value }); // Simpan yang terbaru di atas
            localStorage.setItem('chatHistory', JSON.stringify(history));
            
            // Tampilkan jawaban AI
            document.getElementById('solusiText').innerText = jawaban[Math.floor(Math.random() * jawaban.length)];
            document.getElementById('aiResponse').classList.remove('hidden');
            
            input.value = '';
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            const container = document.getElementById('historyList');
            container.innerHTML = history.length ? '' : '<p class="text-xs text-blue-400 italic">Belum ada riwayat cerita...</p>';
            
            history.forEach(item => {
                container.innerHTML += `
                    <div class="p-4 bg-blue-900/30 border-l-4 border-blue-500 rounded-r-xl">
                        <p class="text-[10px] text-blue-300 font-bold">${item.date}</p>
                        <p class="text-sm text-blue-50 mt-1">${item.text}</p>
                    </div>
                `;
            });
        }

        function handleFiles(files) {
            const photos = JSON.parse(localStorage.getItem('chatPhotos') || '[]');
            for (let file of files) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    photos.push(e.target.result);
                    localStorage.setItem('chatPhotos', JSON.stringify(photos));
                    renderPhotos();
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPhotos() {
            const photos = JSON.parse(localStorage.getItem('chatPhotos') || '[]');
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            photos.forEach(src => {
                gallery.innerHTML += `<img src="${src}" class="rounded-2xl w-full h-36 object-cover border border-blue-400/30 shadow-lg">`;
            });
        }
    </script>
</body>
</html>
