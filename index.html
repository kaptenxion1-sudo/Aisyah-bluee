<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Magic Diary & Karaoke 🌀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at center, #1e3a8a 0%, #000 100%); 
            font-family: 'Quicksand', sans-serif; 
            color: white; 
            min-height: 100vh; 
            margin: 0; 
        }
        .font-magic { font-family: 'Fredoka One', cursive; }
        .glass { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(147, 197, 253, 0.2); 
            border-radius: 30px; 
        }
        .karaoke-active { 
            border: 3px solid #60a5fa; 
            box-shadow: 0 0 30px #3b82f6; 
        }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #60a5fa; border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <div id="loginScreen" class="glass p-10 w-full max-w-sm text-center my-auto mt-20 shadow-2xl">
        <h1 class="font-magic text-3xl text-blue-300 mb-2 italic">Akses Biru ❄️</h1>
        <p class="text-[10px] text-blue-200 mb-8 italic">Silakan masukkan kata sandi rahasia...</p>
        <input type="password" id="passInput" class="w-full p-4 rounded-2xl bg-blue-900/40 border border-blue-400 text-center text-white outline-none focus:ring-2 focus:ring-blue-300 transition" placeholder="Sandi: biru">
        <button onclick="checkPass()" class="w-full mt-6 bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition shadow-lg text-sm">BUKA DUNIA MAGIC ✨</button>
    </div>

    <div id="mainContent" class="hidden w-full max-w-lg space-y-6 pt-6 pb-20">
        
        <div id="playerCard" class="glass p-6 transition-all duration-500">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-magic text-xs text-blue-300">🎵 Arijit Singh Playlist</h2>
                <button id="btnKaraoke" onclick="toggleKaraoke()" class="text-[9px] bg-indigo-600 px-3 py-1.5 rounded-full font-bold shadow-lg">MODE KARAOKE 🎤</button>
            </div>
            
            <select id="songSelect" onchange="changeSong()" class="w-full p-3 rounded-xl bg-blue-950 border border-blue-700 text-blue-100 text-xs mb-4 outline-none">
                <optgroup label="✨ Terpopuler">
                    <option value="093556093510521111">Tum Hi Ho</option>
                    <option value="K872Tq73lTU">Kesariya</option>
                    <option value="HqUeSjsYLNU">Chaleya</option>
                </optgroup>
                <optgroup label="💔 Galau & Deep">
                    <option value="V1NInp9Kk2o">Channa Mereya</option>
                    <option value="AxStX_Mub2g">Hamari Adhuri Kahani</option>
                    <option value="vO6W0_t2UGo">Muskurane</option>
                </optgroup>
            </select>
            
            <div class="relative w-full overflow-hidden rounded-2xl aspect-video border border-blue-400/20">
                <iframe id="musicPlayer" class="absolute top-0 left-0 w-full h-full" src="https://www.youtube.com/embed/093556093510521111?rel=0" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
        </div>

        <div class="glass p-8 border-t-4 border-blue-500 shadow-2xl">
            <h2 class="font-magic text-xl text-blue-300 mb-4 italic">📝 Ruang Curhat</h2>
            <textarea id="diaryBox" class="w-full h-36 bg-blue-900/10 p-4 rounded-2xl border border-blue-800 text-blue-50 focus:ring-1 focus:ring-blue-400 outline-none resize-none" placeholder="Tuliskan ceritamu di sini..."></textarea>
            <button onclick="saveCurhat()" class="w-full mt-4 bg-blue-700 py-3 rounded-xl font-bold transition shadow-md">Simpan Cerita ✨</button>
            
            <div id="aiResponse" class="hidden mt-6 p-5 bg-blue-400/10 border border-blue-300/30 rounded-2xl text-center">
                <p id="solusiText" class="text-sm italic text-blue-50 leading-relaxed"></p>
            </div>
        </div>

        <div class="glass p-6">
            <h2 class="font-magic text-lg text-blue-300 mb-4 italic text-center">📜 Jejak Cerita</h2>
            <div id="historyList" class="space-y-4 max-h-60 overflow-y-auto pr-2"></div>
        </div>

        <p class="text-center text-[9px] text-blue-500 opacity-40 pb-10">Quantum Heart v8.8 | Private Edition 💎</p>
    </div>

    <script>
        const PIN = "biru";
        const daftarJawaban = [
            "Terima kasih sudah bercerita. Kamu adalah sosok yang hebat. 💙",
            "Tenangkan hatimu sejenak. Besok akan ada hari yang lebih baik. ✨",
            "Setiap masalah pasti punya jalan keluar. Kamu tidak sendiri. 😊",
            "Istirahatlah, kamu sudah melakukan yang terbaik hari ini. ❄️"
        ];

        function checkPass() {
            if(document.getElementById('passInput').value.toLowerCase() === PIN) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                renderHistory();
            } else { alert('Kata sandi salah.'); }
        }

        function changeSong() {
            const videoId = document.getElementById('songSelect').value;
            document.getElementById('musicPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        }

        function toggleKaraoke() {
            document.getElementById('playerCard').classList.toggle('karaoke-active');
        }

        function saveCurhat() {
            const input = document.getElementById('diaryBox');
            if(!input.value.trim()) return;

            const time = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            history.unshift({ date: time, text: input.value });
            localStorage.setItem('chatHistory', JSON.stringify(history));
            
            document.getElementById('solusiText').innerText = daftarJawaban[Math.floor(Math.random() * daftarJawaban.length)];
            document.getElementById('aiResponse').classList.remove('hidden');
            
            input.value = '';
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            const container = document.getElementById('historyList');
            container.innerHTML = history.length ? '' : '<p class="text-[10px] text-center opacity-40 italic">Belum ada cerita...</p>';
            history.forEach(item => {
                container.innerHTML += `<div class="p-4 bg-blue-900/20 border-l-4 border-blue-500 rounded-r-xl mb-3 shadow-sm"><p class="text-[8px] text-blue-300 font-bold">${item.date}</p><p class="text-xs text-white mt-1 leading-relaxed">${item.text}</p></div>`;
            });
        }
    </script>
</body>
</html>
